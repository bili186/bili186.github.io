<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="GLAW logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132647"/>
      <stop offset="100%" stop-color="#0A1526"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- visual patches -->
  <g fill="#2E5A8F" opacity="0.6">
    <rect x="56"  y="64"  width="56" height="56" rx="12"/>
    <rect x="196" y="64"  width="56" height="56" rx="12"/>
    <rect x="56"  y="134" width="56" height="56" rx="12"/>
    <rect x="196" y="134" width="56" height="56" rx="12"/>
    <rect x="56"  y="204" width="56" height="56" rx="12"/>
    <rect x="126" y="204" width="56" height="56" rx="12"/>
    <rect x="196" y="204" width="56" height="56" rx="12"/>
  </g>

  <!-- selected patch (CMATS) -->
  <rect x="126" y="134" width="56" height="56" rx="12" fill="#38BDF8"/>

  <!-- textual tokens -->
  <g fill="#2E5A8F" opacity="0.6">
    <rect x="286" y="89"  width="156" height="26" rx="13"/>
    <rect x="286" y="209" width="84"  height="26" rx="13"/>
  </g>
  <rect x="286" y="149" width="120" height="26" rx="13" fill="#38BDF8"/>

  <!-- wordmark -->
  <text x="256" y="390" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="104" font-weight="800" letter-spacing="7" fill="#F8FAFC">GLAW</text>
</svg>
